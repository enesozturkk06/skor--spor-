<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#080D0D" />
    <meta name="color-scheme" content="dark" />
    <title>%WEB_TITLE%</title>
    <!-- Brand icons from `npm run icons:build`; Expo also adds /favicon.ico from assets/favicon.png. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      Web template for `expo export -p web` (single output). Expo appends the
      app's <script> tags; everything else here is ours:
      - the fonts block below is GENERATED by `npm run fonts:build` (do not edit by hand)
      - #skor-shell: the branded first screen, drawn by the browser before any
        JavaScript runs. The app removes it once its first screen is ready
        (src/app/_layout.tsx → hideStartupShell).
    -->
    <!-- skor-fonts:start -->
    <link rel="preload" href="/fonts/BarlowCondensed_800ExtraBold_Italic.31ff5f1612.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Inter_400Regular.593ab66129.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Inter_600SemiBold.12298c965a.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/skor-icons.1d7b8456db.woff2" as="font" type="font/woff2" crossorigin />
    <style id="skor-fonts">
      @font-face { font-family: BarlowCondensed_600SemiBold; src: url(/fonts/BarlowCondensed_600SemiBold.6dbddd7944.woff2) format('woff2'); font-display: swap; }
      @font-face { font-family: BarlowCondensed_700Bold; src: url(/fonts/BarlowCondensed_700Bold.e4c421fa82.woff2) format('woff2'); font-display: swap; }
      @font-face { font-family: BarlowCondensed_800ExtraBold; src: url(/fonts/BarlowCondensed_800ExtraBold.1d5cc73bd3.woff2) format('woff2'); font-display: swap; }
      @font-face { font-family: BarlowCondensed_800ExtraBold_Italic; src: url(/fonts/BarlowCondensed_800ExtraBold_Italic.31ff5f1612.woff2) format('woff2'); font-display: swap; }
      @font-face { font-family: Inter_400Regular; src: url(/fonts/Inter_400Regular.593ab66129.woff2) format('woff2'); font-display: swap; }
      @font-face { font-family: Inter_500Medium; src: url(/fonts/Inter_500Medium.1ac4ff9085.woff2) format('woff2'); font-display: swap; }
      @font-face { font-family: Inter_600SemiBold; src: url(/fonts/Inter_600SemiBold.12298c965a.woff2) format('woff2'); font-display: swap; }
      @font-face { font-family: Inter_700Bold; src: url(/fonts/Inter_700Bold.481ebecde1.woff2) format('woff2'); font-display: swap; }
      @font-face { font-family: skor-icons; src: url(/fonts/skor-icons.1d7b8456db.woff2) format('woff2'); font-display: block; }
    </style>
    <!-- skor-fonts:end -->
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <style id="skor-shell-style">
      html,
      body {
        margin: 0;
        background: #080d0d;
        color: #f4f1ea;
      }
      #skor-shell {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        /* Purely visual: never takes a tap meant for the app underneath. */
        pointer-events: none;
        display: flex;
        justify-content: center;
        background-color: #080d0d;
        background-image:
          radial-gradient(120% 60% at 0% 0%, rgba(13, 90, 82, 0.55) 0%, rgba(7, 60, 56, 0.22) 45%, rgba(8, 13, 13, 0) 75%),
          radial-gradient(90% 55% at 100% 100%, rgba(255, 113, 56, 0.1) 0%, rgba(8, 13, 13, 0) 70%);
        transition: opacity 220ms ease-out;
      }
      #skor-shell.is-leaving {
        opacity: 0;
      }
      #skor-shell .ss-col {
        position: relative;
        box-sizing: border-box;
        width: 100%;
        max-width: 512px;
        height: 100%;
        padding: 28px 16px 40px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      #skor-shell .ss-lines {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: min(520px, 110vw);
        opacity: 0.55;
        animation: ss-lines 900ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      #skor-shell .ss-lines svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      #skor-shell .ss-brand {
        position: relative;
        display: flex;
        align-items: center;
        gap: 12px;
        animation: ss-rise 700ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      #skor-shell .ss-word {
        font-family: BarlowCondensed_800ExtraBold_Italic, 'Arial Narrow', 'Roboto Condensed', 'Helvetica Neue', Arial, sans-serif;
        font-size: 30px;
        line-height: 1;
        letter-spacing: 0.5px;
      }
      #skor-shell .ss-word b {
        font-weight: inherit;
        color: #d6b77a;
      }
      #skor-shell .ss-hero {
        position: relative;
        animation: ss-rise 700ms cubic-bezier(0.2, 0.8, 0.2, 1) 60ms both;
      }
      #skor-shell .ss-kicker {
        margin: 0 0 12px;
        font-family: Inter_600SemiBold, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
        font-size: 11px;
        line-height: 14px;
        letter-spacing: 1.6px;
        color: #d6b77a;
      }
      /* Same type scale as the welcome screen hero (src/app/welcome.tsx). */
      #skor-shell .ss-slogan {
        margin: 0;
        font-family: BarlowCondensed_800ExtraBold_Italic, 'Arial Narrow', 'Roboto Condensed', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 400;
        font-size: 52px;
        line-height: 0.96;
        letter-spacing: 0.5px;
      }
      #skor-shell .ss-slogan span {
        color: #ff7138;
      }
      @media (min-width: 380px) {
        #skor-shell .ss-slogan {
          font-size: 64px;
        }
      }
      @media (min-width: 720px) {
        #skor-shell .ss-slogan {
          font-size: 84px;
        }
      }
      #skor-shell .ss-bar {
        position: relative;
        height: 3px;
        border-radius: 3px;
        overflow: hidden;
        background: rgba(244, 241, 234, 0.08);
      }
      #skor-shell .ss-bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 3px;
        background: linear-gradient(90deg, rgba(255, 113, 56, 0), #ff7138 55%, #d6b77a);
        animation: ss-load 1.15s cubic-bezier(0.45, 0, 0.25, 1) infinite;
      }
      @keyframes ss-lines {
        from {
          transform: translate3d(48px, -36px, 0);
          opacity: 0;
        }
      }
      /* Only position animates: the text is visible from the first frame. */
      @keyframes ss-rise {
        from {
          transform: translate3d(0, 14px, 0);
        }
      }
      @keyframes ss-load {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #skor-shell,
        #skor-shell * {
          animation: none !important;
          transition: none !important;
        }
        #skor-shell .ss-bar::after {
          width: 100%;
          opacity: 0.5;
        }
      }
    </style>
  </head>

  <body>
    <noscript>SKOR SPOR'u kullanmak için tarayıcında JavaScript'i etkinleştir.</noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <div id="skor-shell" aria-hidden="true">
      <div class="ss-col">
        <div class="ss-lines">
          <svg viewBox="0 0 400 520" preserveAspectRatio="xMidYMid slice" focusable="false">
            <defs>
              <linearGradient id="ss-lp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0D5A52" stop-opacity=".9" /><stop offset="1" stop-color="#073C38" stop-opacity="0" /></linearGradient>
              <linearGradient id="ss-lo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF7138" stop-opacity=".9" /><stop offset="1" stop-color="#FF7138" stop-opacity="0" /></linearGradient>
              <linearGradient id="ss-lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D6B77A" stop-opacity=".6" /><stop offset="1" stop-color="#D6B77A" stop-opacity="0" /></linearGradient>
            </defs>
            <path d="M250 -20 L330 -20 L170 540 L90 540 Z" fill="url(#ss-lp)" />
            <path d="M340 -20 L372 -20 L212 540 L180 540 Z" fill="url(#ss-lo)" />
            <path d="M392 -20 L408 -20 L248 540 L232 540 Z" fill="url(#ss-lg)" />
          </svg>
        </div>
        <div class="ss-brand">
          <svg width="40" height="40" viewBox="0 0 48 48" focusable="false">
            <defs>
              <linearGradient id="ss-tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D5A52" /><stop offset="1" stop-color="#042926" /></linearGradient>
              <linearGradient id="ss-or" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF7138" /><stop offset="1" stop-color="#E2551F" /></linearGradient>
            </defs>
            <rect x="0" y="0" width="48" height="48" rx="13" fill="url(#ss-tile)" />
            <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="12.25" fill="none" stroke="#D6B77A" stroke-opacity=".35" stroke-width="1.5" />
            <path d="M17 37 L25 11 L32 11 L24 37 Z" fill="url(#ss-or)" />
            <path d="M27 37 L31 24 L37 24 L33 37 Z" fill="#D6B77A" />
            <path d="M11 37 L13 30 L19 30 L17 37 Z" fill="#F4F1EA" fill-opacity=".9" />
          </svg>
          <div class="ss-word">SKOR <b>SPOR</b></div>
        </div>
        <div class="ss-hero">
          <p class="ss-kicker">SPORCU PERFORMANS PLATFORMU</p>
          <h1 class="ss-slogan">OWN YOUR<br /><span>PERFORMANCE.</span></h1>
        </div>
        <div class="ss-bar"></div>
      </div>
    </div>
    <script>
      (function () {
        var shell = document.getElementById('skor-shell');
        var gone = false;
        // Called by the app (src/lib/startup-shell.ts) when its first screen is ready.
        window.__skorHideShell = function () {
          if (gone || !shell) return;
          gone = true;
          var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (reduce) return shell.remove();
          shell.classList.add('is-leaving');
          setTimeout(function () {
            shell.remove();
          }, 260);
        };
        // Never cover an app that failed to start (e.g. a script blocked by the network).
        setTimeout(window.__skorHideShell, 20000);
        // After everything else: fetch the remaining font weights while the visitor reads.
        window.addEventListener('load', function () {
          var idle = window.requestIdleCallback || function (cb) { return setTimeout(cb, 200); };
          idle(function () {
            if (!document.fonts || !document.fonts.forEach) return;
            document.fonts.forEach(function (face) {
              if (face.status === 'unloaded') face.load().catch(function () {});
            });
          });
        });
      })();
    </script>
  </body>
</html>
